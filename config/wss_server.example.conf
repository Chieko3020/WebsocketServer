# 示例配置：复制为 wss_server.conf 后按需修改。
# cp config/wss_server.example.conf config/wss_server.local.conf
# ./build/wss_server --config config/wss_server.local.conf

port=8443
cert=certs/server_cert.pem
key=certs/server_key.pem

enable_ticket=1
session_timeout=300
# 浏览器演示须为 0；CLI 与 scripts/selftest_0rtt.sh 测 0-RTT 时改为 1
enable_0rtt=0

http_port=8080
http_root=web

log_dir=log
log_file=true

# 空闲秒数；浏览器场景建议 ≥ 60
ws_idle_timeout=120
# 服务端 Ping 间隔；0=自动（约为 idle/3，至少 5）
ws_ping_interval=0
