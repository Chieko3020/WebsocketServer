# wss_server 配置文件（key=value，# 为注释）
# 启动时默认读取本文件；可用命令行 --config <路径> 覆盖。
# 命令行参数优先级高于本文件。

# ---- 必填（若不在命令行提供）----
port=8443
cert=certs/server_cert.pem
key=certs/server_key.pem

# ---- TLS / 会话 ----
enable_ticket=1
session_timeout=300
# 0-RTT 实验（与 OpenSSL early data 配额配合；开启时升级请求须带 X-Nonce）。
# 浏览器 WebSocket API 无法发送自定义头，演示页连接须保持 0；命令行 wss_client 测 0-RTT 时改为 1。
enable_0rtt=0

# ---- 内置明文 HTTP（静态页）----
http_port=8080
http_root=web

# ---- 日志 ----
log_dir=log
log_file=true

# ---- WebSocket 空闲与心跳（0 表示使用程序内自动默认）----
ws_idle_timeout=120
ws_ping_interval=0
